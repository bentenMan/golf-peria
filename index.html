<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ゴルフハンディ計算（ローカルペリア方式）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>ゴルフハンディ計算（ローカルペリア）</h2>

<div class="section">
  <h3>① 隠しホール設定（9ホール）</h3>
  <button onclick="generateHidden()">隠しホールをランダム生成</button>
  <p id="hiddenResult"></p>
</div>

<div class="section">
  <h3>② 隠しホールの PAR 入力</h3>
  <div id="parInputs"></div>
</div>

<div class="section">
  <h3>③ プレーヤー入力（最大10名）</h3>
  <button onclick="addPlayer()">プレーヤー追加</button>
  <div id="players"></div>
</div>

<div class="section">
  <h3>④ ハンディ計算</h3>
  <button onclick="calculate()">計算する</button>
  <table id="resultTable"></table>
</div>

<script src="main.js"></script>
</body>
</html>
